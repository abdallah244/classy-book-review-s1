<!-- ══════════════════════════════════════════════════════
   Classy Book — User Dashboard Sidenav
   Combined Sidebar + Top Navbar
   ══════════════════════════════════════════════════════ -->

<div
  class="layout"
  [dir]="isAr() ? 'rtl' : 'ltr'"
  [class.collapsed]="collapsed()"
  [class.mobile-open]="mobileOpen()"
>
  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">
    <!-- Sidebar Header: Logo + Collapse -->
    <div class="sidebar-header">
      <div class="logo" (click)="goHome()">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path
              d="M4 19.5A2.5 2.5 0 016.5 17H20"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M8 7h8M8 11h6"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <span class="logo-text">Classy Book</span>
      </div>
      <button
        class="collapse-btn"
        (click)="toggleCollapse()"
        [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          @if (collapsed()) {
            <polyline points="9 18 15 12 9 6" />
          } @else {
            <polyline points="15 18 9 12 15 6" />
          }
        </svg>
      </button>
    </div>

    <!-- Nav Items -->
    <nav class="sidebar-nav">
      @for (item of navItems; track item.id) {
        <button
          class="nav-item"
          [class.active]="activeItem() === item.id"
          (click)="selectItem(item)"
          [attr.title]="collapsed() ? (isAr() ? item.labelAr : item.labelEn) : null"
        >
          <span class="nav-icon">
            @switch (item.icon) {
              @case ('grid') {
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="3" width="7" height="7" rx="1.5" />
                  <rect x="14" y="3" width="7" height="7" rx="1.5" />
                  <rect x="3" y="14" width="7" height="7" rx="1.5" />
                  <rect x="14" y="14" width="7" height="7" rx="1.5" />
                </svg>
              }
              @case ('book') {
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z" />
                  <path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z" />
                </svg>
              }
              @case ('chart') {
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="18" y1="20" x2="18" y2="10" />
                  <line x1="12" y1="20" x2="12" y2="4" />
                  <line x1="6" y1="20" x2="6" y2="14" />
                </svg>
              }
              @case ('award') {
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="8" r="6" />
                  <path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11" />
                </svg>
              }
              @case ('message') {
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />
                </svg>
              }
              @case ('settings') {
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="3" />
                  <path
                    d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"
                  />
                </svg>
              }
            }
          </span>
          <span class="nav-label">{{ isAr() ? item.labelAr : item.labelEn }}</span>
          @if (item.id === 'messages') {
            <span class="nav-badge">3</span>
          }
        </button>
      }
    </nav>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer">
      <!-- User Mini Profile -->
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">
          @if (user()?.avatar) {
            <img [src]="user()!.avatar" alt="avatar" />
          } @else {
            <span class="avatar-letter">{{ userInitial() }}</span>
          }
        </div>
        <div class="sidebar-user-info">
          <span class="sidebar-user-name">{{ user()?.name || 'User' }}</span>
          <span class="sidebar-user-role">{{ user()?.role || 'student' }}</span>
        </div>
      </div>

      <div class="sidebar-actions">
        <button
          class="action-btn"
          (click)="toggleTheme()"
          [attr.title]="isAr() ? 'المظهر' : 'Theme'"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
          </svg>
        </button>
        <button
          class="action-btn"
          (click)="toggleLanguage()"
          [attr.title]="isAr() ? 'English' : 'العربية'"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="2" y1="12" x2="22" y2="12" />
            <path
              d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"
            />
          </svg>
        </button>
        <button
          class="action-btn logout"
          (click)="logout()"
          [attr.title]="isAr() ? 'تسجيل خروج' : 'Logout'"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Mobile Overlay -->
  <div class="mobile-overlay" [class.visible]="mobileOpen()" (click)="toggleMobile()"></div>

  <!-- ═══ TOP NAVBAR ═══ -->
  <div class="main-area">
    <header class="topnav">
      <div class="topnav-left">
        <!-- Mobile hamburger -->
        <button class="hamburger" (click)="toggleMobile()">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="15" y2="12" />
            <line x1="3" y1="18" x2="18" y2="18" />
          </svg>
        </button>

        <!-- Search -->
        <div class="search-box">
          <svg
            class="search-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            type="text"
            class="search-input"
            [placeholder]="isAr() ? 'ابحث عن أشخاص، مجموعات، بوستات...' : 'Search people, groups, posts...'"
            (input)="onSearchInput($event)"
            (focus)="isSearchVisible.set(searchQuery().length >= 2)"
            (blur)="isSearchVisible.set(false)"
          />

          <!-- Unified Search Dropdown -->
          <app-global-search-dropdown 
            [query]="searchQuery()" 
            [isVisible]="isSearchVisible()"
          ></app-global-search-dropdown>
        </div>
      </div>

      <div class="topnav-right">
        <!-- Notification Dropdown -->
        <app-notification-dropdown></app-notification-dropdown>

        <!-- Greeting + Avatar -->
        <div class="topnav-user" (click)="selectItem(navItems[5])">
          <div class="topnav-user-info">
            <span class="topnav-greeting">{{ greeting() }}</span>
            <span class="topnav-role">{{ user()?.role || 'student' }}</span>
          </div>
          <div class="topnav-avatar">
            @if (user()?.avatar) {
              <img [src]="user()!.avatar" alt="avatar" />
            } @else {
              <span class="avatar-letter">{{ userInitial() }}</span>
            }
          </div>
        </div>
      </div>
    </header>

    <!-- Content outlet -->
    <div class="page-content">
      <ng-content></ng-content>
    </div>
  </div>
</div>
